name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Smoke-run the CLI
        run: |
          python -m annotator --data /tmp/demo seed
          python -m annotator --data /tmp/demo simulate --annotators 3
          python -m annotator --data /tmp/demo stats
          python -m annotator --data /tmp/demo export --out /tmp/demo/pairs.jsonl --min-votes 2
